<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OG render (dev tool)</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; background: #999; font-family: 'IBM Plex Mono', monospace; }
    #heart { position: absolute; left: -9999px; top: 0; width: 720px; height: 720px; }
    #heart canvas { width: 100%; height: 100%; }
    #og { width: 1200px; height: 630px; display: block; }
  </style>
</head>
<body>
  <!-- Dev-only: renders the share image + WebGL fallback from the live graphics
       and writes them into public/ via the dev server's /__save endpoint. -->
  <div id="heart"><canvas></canvas></div>
  <canvas id="og" width="1200" height="630"></canvas>
  <pre id="log"></pre>
  <script type="module" src="./og.js"></script>
</body>
</html>
